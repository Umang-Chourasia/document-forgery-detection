<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Document Forensics</title>
  <!-- Dark tile: reads on light and dark tab bars alike. -->
  <rect width="64" height="64" rx="14" fill="#020108"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#2a2a30" stroke-width="1.5"/>
  <!-- Registration corners, the same frame as the in-app logo mark. -->
  <path d="M9 18V11a2 2 0 0 1 2-2h7M46 9h7a2 2 0 0 1 2 2v7M55 46v7a2 2 0 0 1-2 2h-7M18 55h-7a2 2 0 0 1-2-2v-7" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- The document under examination. -->
  <path d="M21 15.5h16l7 7V47a1.5 1.5 0 0 1-1.5 1.5h-21.5A1.5 1.5 0 0 1 19.5 47V17a1.5 1.5 0 0 1 1.5-1.5z" fill="#ffffff"/>
  <path d="M37 15.5v5.5a1.5 1.5 0 0 0 1.5 1.5H44z" fill="#c9c7c0"/>
  <rect x="24" y="24" width="10" height="2.4" rx="1.2" fill="#c9c7c0"/>
  <rect x="24" y="29" width="15" height="2.4" rx="1.2" fill="#c9c7c0"/>
  <!-- Scan line and the localized evidence it found. -->
  <rect x="15" y="37" width="34" height="2" rx="1" fill="#5cc4b3"/>
  <circle cx="34" cy="38" r="5" fill="#ff5a54"/>
  <circle cx="34" cy="38" r="2" fill="#ffd400"/>
</svg>
